name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Verify PySide6 is installed
        run: |
          python -c "import PySide6; print('PySide6:', PySide6.__version__, PySide6.__file__)"
          python -c "import shiboken6; print('shiboken6 OK')"
          python -c "import loguru; print('loguru OK')"

      - name: Build with .spec file (collects all Qt libs)
        run: |
          pyinstaller --noconfirm --clean NSE_OI_Scanner.spec

      - name: Show output size
        run: |
          Get-ChildItem -Recurse dist\NSE_OI_Scanner | Measure-Object -Property Length -Sum
          Get-ChildItem dist\NSE_OI_Scanner | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NSE_OI_Scanner-Windows
          path: dist/NSE_OI_Scanner/
          retention-days: 14
