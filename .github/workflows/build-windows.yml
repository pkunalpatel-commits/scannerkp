name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build onedir EXE (recommended)
        run: |
          pyinstaller --noconfirm --windowed --name "NSE_OI_Scanner" `
            --add-data "config;config" `
            --add-data "ui;ui" `
            --add-data "core;core" `
            --hidden-import=loguru `
            --hidden-import=core.logger `
            --hidden-import=PySide6 `
            --hidden-import=PySide6.QtCore `
            --hidden-import=PySide6.QtGui `
            --hidden-import=PySide6.QtWidgets `
            --hidden-import=sqlalchemy.sql.default_comparator `
            --hidden-import=pandas `
            --hidden-import=numpy `
            --hidden-import=requests `
            --hidden-import=websockets `
            --collect-all=loguru `
            --collect-all=PySide6 `
            --collect-all=sqlalchemy `
            main.py

      - name: Upload onedir artifact
        uses: actions/upload-artifact@v4
        with:
          name: NSE_OI_Scanner-Windows
          path: dist/NSE_OI_Scanner/
          retention-days: 14

      - name: Build single-file EXE (slower startup)
        run: |
          pyinstaller --noconfirm --windowed --onefile --name "NSE_OI_Scanner_OneFile" `
            --add-data "config;config" `
            --add-data "ui;ui" `
            --add-data "core;core" `
            --hidden-import=loguru `
            --hidden-import=core.logger `
            --hidden-import=PySide6 `
            --hidden-import=PySide6.QtCore `
            --hidden-import=PySide6.QtGui `
            --hidden-import=PySide6.QtWidgets `
            --collect-all=loguru `
            --collect-all=PySide6 `
            main.py

      - name: Upload onefile artifact
        uses: actions/upload-artifact@v4
        with:
          name: NSE_OI_Scanner-OneFile
          path: dist/NSE_OI_Scanner_OneFile.exe
          retention-days: 14
