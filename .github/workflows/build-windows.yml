name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 loguru pandas numpy SQLAlchemy requests websockets aiosqlite python-dateutil pytz plyer
          pip install dhanhq || echo "dhanhq optional for build"
          pip install pyinstaller

      - name: Verify critical packages
        run: |
          python -c "import PySide6; print('PySide6', PySide6.__version__)"
          python -c "import shiboken6; print('shiboken6 OK')"
          python -c "import loguru; print('loguru OK')"
          python -c "from PySide6.QtWidgets import QApplication; print('QtWidgets OK')"

      - name: Build with .spec
        run: |
          pyinstaller --noconfirm --clean NSE_OI_Scanner.spec

      - name: Show size
        run: |
          Get-ChildItem dist\NSE_OI_Scanner -Recurse | Measure-Object -Property Length -Sum | Select-Object Count, @{N='SizeMB';E={[math]::Round($_.Sum/1MB,1)}}
          Get-ChildItem dist\NSE_OI_Scanner | Format-Table Name, Length -AutoSize

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NSE_OI_Scanner-Windows
          path: dist/NSE_OI_Scanner/
          retention-days: 14
